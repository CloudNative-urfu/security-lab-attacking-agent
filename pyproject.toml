[project]
name = "attacking-agent"
version = "0.1.0"
description = "Харнес атакующего агента (АГ) полигона: безопасная оркестрация авторизованных исследовательских кампаний"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
llm = [
    "litellm>=1.50,<2",
]
pg = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]
otel = [
    "opentelemetry-sdk>=1.27,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attacking_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: интеграционные тесты, требующие внешней инфраструктуры (PostgreSQL и т.п.)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["attacking_agent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["attacking_agent"]
branch = true
