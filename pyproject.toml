[project]
name = "attacking-agent"
version = "0.1.0"
description = "Харнес атакующего агента (АГ) полигона: безопасная оркестрация авторизованных исследовательских кампаний"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.54.0",
]
llm = [
    "litellm>=1.50,<2",
]
cloudru = [
    "evolution-openai>=0.1",
]
pg = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]
otel = [
    "opentelemetry-sdk>=1.27,<2",
]
temporal = [
    "temporalio>=1.36,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0,<6",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "detect-secrets>=1.5.0",
    "temporalio>=1.36.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attacking_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: интеграционные тесты, требующие внешней инфраструктуры (PostgreSQL и т.п.)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PERF", "PTH", "C4", "RET", "PIE"]
# Проект намеренно на русском: не считать кириллицу «неоднозначной».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends()/Header() в значениях по умолчанию — штатная идиома FastAPI.
"src/attacking_agent/app/api.py" = ["B008"]
# Тесты: assert — норма; «секреты» в фикстурах не настоящие.
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["attacking_agent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*", "evolution_openai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["attacking_agent"]
branch = true
