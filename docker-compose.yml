# Dev-инфраструктура для интеграционных доказательств (не для production).
# postgres — источник истины (budget/journal/memory), pgvector для будущего поиска.
# temporal — устойчивый рантайм (dev-режим) для доказательства идемпотентности под replay.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ag
      POSTGRES_PASSWORD: ag
      POSTGRES_DB: ag
    ports:
      - "5433:5432"
    volumes:
      # Создаёт отдельную БД litellm на свежем стенде (LiteLLM/Prisma требует чистую БД).
      - ./docker/postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag -d ag"]
      interval: 2s
      timeout: 3s
      retries: 30

  llm-gateway:
    build: .
    command: ["python", "-m", "services.llm_gateway"]
    environment:
      AG_PORT: "8081"
      AG_MODEL: "gpt-4o-mini"
    ports:
      - "8081:8081"

  tool-runner:
    build: .
    command: ["python", "-m", "services.tool_runner"]
    environment:
      AG_PORT: "8082"
    ports:
      - "8082:8082"

  # LiteLLM Proxy: единый OpenAI-совместимый endpoint для моделей агента + веб-админка.
  # UI: http://localhost:4000/ui (вход по LITELLM_MASTER_KEY). Модели/ключи/бюджеты — в UI,
  # persist в общей БД ag (STORE_MODEL_IN_DB). Cloud.ru с IAM-токеном сюда не кладём —
  # он остаётся на CloudRuLLMClient; прокси для vLLM/OpenAI-совместимых моделей (статичный ключ).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master}
      DATABASE_URL: postgresql://ag:ag@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      VLLM_API_BASE: ${VLLM_API_BASE:-http://host.docker.internal:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-dummy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "4000:4000"

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=ag
      - POSTGRES_PWD=ag
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
