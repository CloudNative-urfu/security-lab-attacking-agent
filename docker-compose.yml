# Dev-инфраструктура для интеграционных доказательств (не для production).
# postgres — источник истины (budget/journal/memory), pgvector для будущего поиска.
# temporal — устойчивый рантайм (dev-режим) для доказательства идемпотентности под replay.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ag
      POSTGRES_PASSWORD: ag
      POSTGRES_DB: ag
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag -d ag"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=ag
      - POSTGRES_PWD=ag
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
